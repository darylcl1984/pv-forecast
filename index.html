<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Solar">
<meta name="theme-color" content="#f8f7f4">
<title>Solar Forecast</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --sun: #E8950E; --sun-light: #FFF3D6; --sun-mid: #FCCF5A;
    --sky: #4A9EE8; --sky-light: #E8F4FD;
    --cloud: #90A4AE; --cloud-light: #ECEFF1;
    --ev: #34C759; --ev-light: #E5F9EB;
    --bg: #F8F7F4; --surface: #FEFCF8; --surface-alt: #F2F1EE;
    --text: #1D1D1F; --text-2: #6E6E73; --text-3: #AEAEB2;
    --border: rgba(0,0,0,0.06); --border-strong: rgba(0,0,0,0.1);
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.04), 0 1px 2px rgba(0,0,0,0.03);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.06), 0 1px 4px rgba(0,0,0,0.04);
    --radius: 14px; --radius-sm: 10px; --radius-xs: 8px;
    --font: 'Outfit', -apple-system, sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, monospace;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { background: var(--bg); }
  body {
    font-family: var(--font); color: var(--text); background: var(--bg);
    min-height: 100vh; min-height: 100dvh;
    -webkit-font-smoothing: antialiased;
    padding-top: var(--safe-top); padding-bottom: calc(var(--safe-bottom) + 20px);
    overflow-x: hidden;
  }
  .header {
    padding: 20px 20px 16px; text-align: center;
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 100;
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    background: rgba(248,247,244,0.85);
  }
  .header-icon {
    width: 36px; height: 36px; border-radius: 10px;
    background: linear-gradient(135deg, var(--sun), #F7C948);
    display: inline-flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 8px rgba(245,166,35,0.3); margin-bottom: 6px;
  }
  .header h1 { font-size: 20px; font-weight: 600; letter-spacing: -0.03em; }
  .header-sub { font-size: 12px; color: var(--text-3); margin-top: 2px; font-family: var(--mono); }

  .weekly-section { padding: 16px 16px 0; }
  .section-title {
    font-size: 11px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--text-3); margin-bottom: 10px; padding-left: 4px;
  }
  .weekly-scroll {
    display: flex; gap: 8px; overflow-x: auto;
    scrollbar-width: none; -webkit-overflow-scrolling: touch; padding-bottom: 4px;
  }
  .weekly-scroll::-webkit-scrollbar { display: none; }
  .day-card {
    flex: 0 0 auto; min-width: 72px; padding: 10px 10px 8px;
    background: var(--surface); border-radius: var(--radius-sm);
    border: 1.5px solid var(--border); text-align: center;
    cursor: pointer; transition: all 0.2s ease;
    user-select: none; -webkit-user-select: none;
  }
  .day-card.active { border-color: var(--sun); background: var(--sun-light); box-shadow: 0 0 0 3px rgba(245,166,35,0.1); }
  .day-card .day-name { font-size: 10px; font-weight: 500; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.04em; }
  .day-card .day-date { font-size: 13px; font-weight: 600; color: var(--text); margin: 2px 0; }
  .day-card .day-kwh { font-size: 15px; font-weight: 700; color: var(--sun); font-family: var(--mono); }
  .day-card .day-unit { font-size: 9px; color: var(--text-3); }
  .day-card .day-cloud { font-size: 10px; color: var(--cloud); margin-top: 2px; }
  .kwh-badge {
    display: inline-flex; align-items: baseline; gap: 2px;
    padding: 3px 8px; border-radius: 20px; margin: 3px 0;
  }
  .kwh-badge .kval { font-size: 15px; font-weight: 500; font-family: var(--mono); }
  .kwh-badge .kunit { font-size: 9px; font-weight: 400; }
  .kwh-badge.ev-good  { background: #F0FAF4; color: #3D8B5E; }
  .kwh-badge.ev-part  { background: #FDF6EC; color: #B87200; }
  .kwh-badge.ev-none  { background: #FBEAE8; color: #BE3D28; }

  .week-bar-wrap { padding: 10px 16px 0; }
  .week-bars {
    display: flex; gap: 3px; align-items: flex-end; height: 44px; padding: 4px 4px 0;
    background: var(--surface); border-radius: var(--radius-sm); border: 1px solid var(--border);
  }
  .week-bar {
    flex: 1; border-radius: 4px 4px 0 0; min-height: 3px;
    background: var(--sun-light); transition: all 0.3s ease;
  }
  .week-bar.active { background: var(--sun); }
  .week-bar.cloudy { background: var(--cloud-light); }
  .week-bar.cloudy.active { background: var(--cloud); }

  .stats {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
    padding: 16px 16px 0; max-width: 560px; margin: 0 auto;
  }
  .stat-card {
    background: var(--surface); border-radius: var(--radius-sm);
    border: 1px solid var(--border); padding: 12px; text-align: center;
    box-shadow: var(--shadow-sm);
  }
  .stat-label { font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-3); margin-bottom: 4px; }
  .stat-value { font-size: 19px; font-weight: 500; font-family: 'Space Grotesk', var(--font); letter-spacing: -0.01em; line-height: 1; }
  .stat-unit { font-size: 10px; color: var(--text-3); margin-top: 2px; }
  .stat-value.gold,  .stat-unit.gold  { color: var(--sun); }
  .stat-value.blue,  .stat-unit.blue  { color: var(--sky); }
  .stat-value.green, .stat-unit.green { color: #3D8B5E; }
  .stat-value.amber, .stat-unit.amber { color: #B87200; }
  .stat-value.red,   .stat-unit.red   { color: #BE3D28; }

  .sun-strip {
    display: flex; justify-content: center; gap: 20px;
    padding: 10px 16px; font-size: 12px; color: var(--text-3); font-family: var(--mono);
  }
  .sun-strip span { display: flex; align-items: center; gap: 4px; }

  .weather-strip {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    padding: 6px 16px 10px; font-size: 13px;
  }
  .weather-emoji { font-size: 20px; line-height: 1; }
  .weather-desc { color: var(--text-2); font-weight: 500; }
  .weather-temps { font-family: var(--mono); font-size: 12px; color: var(--text-3); }

  .chart-section { padding: 0 12px; max-width: 580px; margin: 0 auto; }
  .chart-container {
    background: var(--surface); border-radius: var(--radius);
    border: 1px solid var(--border); padding: 12px 8px 4px 0;
    box-shadow: var(--shadow-sm); position: relative;
  }
  .chart-canvas-wrap { position: relative; height: 260px; width: 100%; }
  .chart-legend { display: flex; justify-content: center; gap: 16px; padding: 6px 0 2px; font-size: 10px; color: var(--text-3); }
  .chart-legend span { display: flex; align-items: center; gap: 4px; }
  .legend-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

  .spinner-overlay {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,0.8); border-radius: var(--radius); z-index: 10;
    backdrop-filter: blur(4px);
  }
  .spinner { width: 28px; height: 28px; border: 2.5px solid var(--border-strong); border-top-color: var(--sun); border-radius: 50%; animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg) } }

  .ev-strip { max-width: 556px; margin: 10px auto 0; padding: 0 16px; }
  .ev-card {
    background: var(--ev-light); border: 1px solid rgba(52,199,89,0.2);
    border-radius: var(--radius-sm); padding: 10px 14px;
    display: flex; align-items: center; gap: 10px; font-size: 12px; color: #1B7A34;
  }
  .ev-card .ev-icon { font-size: 18px; }
  .ev-card .ev-label { font-weight: 500; }
  .ev-card .ev-detail { font-family: var(--mono); font-size: 11px; opacity: 0.8; }
  .ev-card.part-window { background: var(--sun-light); border-color: rgba(245,166,35,0.3); color: #B87200; }
  .ev-card.no-window   { background: #FEECEC; border-color: rgba(192,57,43,0.2); color: #C0392B; }

  @keyframes ring-ccw { to { transform: rotate(-360deg); } }
  .config-btn-wrap {
    position: relative; display: block;
    width: fit-content; margin: 16px auto 0;
    border-radius: calc(var(--radius-xs) + 3px);
    padding: 2px; overflow: hidden;
  }
  .config-btn-wrap::before {
    content: ''; position: absolute; inset: -150%;
    background: conic-gradient(
      rgba(232,149,14,0) 0%, rgba(232,149,14,0) 30%,
      rgba(232,149,14,0.75) 50%,
      rgba(232,149,14,0) 70%, rgba(232,149,14,0) 100%
    );
    animation: ring-ccw 4s linear infinite;
  }
  .config-btn-wrap.no-ring::before { display: none; }
  .config-toggle {
    display: block; margin: 0;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-xs); padding: 8px 18px;
    color: var(--text-2); font-size: 12px; font-weight: 500;
    font-family: var(--font); cursor: pointer; transition: all 0.15s ease;
    position: relative; z-index: 1;
  }
  .config-toggle:active { transform: scale(0.97); }
  .config-panel { max-width: 500px; margin: 12px auto 0; padding: 0 16px; animation: slideDown 0.25s ease; }
  @keyframes slideDown { from { opacity: 0; transform: translateY(-6px) } }
  .config-inner {
    background: var(--surface); border-radius: var(--radius);
    border: 1px solid var(--border); padding: 18px; box-shadow: var(--shadow-md);
  }
  .field-label { display: block; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-3); margin-bottom: 5px; }
  .hint-icon {
    display: inline-flex; align-items: center; justify-content: center;
    width: 12px; height: 12px; border-radius: 50%;
    border: 1px solid var(--text-3); color: var(--text-3);
    font-size: 8px; font-weight: 600; font-style: italic;
    font-family: var(--font); text-transform: none; letter-spacing: 0;
    cursor: pointer; opacity: 0.55; vertical-align: middle; margin-left: 4px;
    user-select: none; -webkit-user-select: none; transition: opacity 0.15s;
    flex-shrink: 0; line-height: 1;
  }
  .hint-icon:hover { opacity: 1; }
  .hint-text {
    display: none; font-size: 10px; color: var(--text-2); line-height: 1.4;
    margin: 3px 0 5px; padding: 5px 8px; font-style: italic;
    background: var(--surface-alt); border-radius: 5px;
    border-left: 2px solid rgba(232,149,14,0.5);
  }
  .hint-text.hint-visible { display: block; }
  .text-input, .num-input {
    background: var(--surface-alt); border: 1px solid var(--border-strong);
    border-radius: var(--radius-xs); padding: 9px 12px; color: var(--text);
    font-size: 14px; font-family: var(--font); outline: none; width: 100%; transition: border-color 0.15s;
  }
  .text-input:focus, .num-input:focus { border-color: var(--sun); box-shadow: 0 0 0 3px rgba(245,166,35,0.1); }
  .text-input::placeholder { color: var(--text-3); }
  .num-input { font-family: var(--mono); font-size: 13px; }
  .num-input.is-default { border-bottom: 1.5px dashed rgba(232,149,14,0.5); }
  .search-row { display: flex; gap: 8px; margin-bottom: 14px; }
  .autocomplete-wrap { flex: 1; position: relative; }
  .autocomplete-list {
    position: absolute; top: 100%; left: 0; right: 0; z-index: 50;
    background: var(--surface); border: 1px solid var(--border-strong);
    border-top: none; border-radius: 0 0 var(--radius-xs) var(--radius-xs);
    box-shadow: var(--shadow-md); max-height: 220px; overflow-y: auto;
  }
  .ac-item {
    padding: 10px 12px; cursor: pointer; font-size: 13px;
    border-bottom: 1px solid var(--border); transition: background 0.1s;
    display: flex; flex-direction: column; gap: 1px;
  }
  .ac-item:last-child { border-bottom: none; }
  .ac-item:hover, .ac-item:active { background: var(--sun-light); }
  .ac-item .ac-name { font-weight: 500; color: var(--text); }
  .ac-item .ac-detail { font-size: 11px; color: var(--text-3); font-family: var(--mono); }
  .btn-primary {
    background: var(--sun); border: none; border-radius: var(--radius-xs);
    padding: 9px 16px; color: white; font-weight: 600; font-size: 13px;
    font-family: var(--font); cursor: pointer; white-space: nowrap; transition: all 0.15s;
  }
  .btn-primary:active { transform: scale(0.97); opacity: 0.9; }
  .btn-secondary {
    background: var(--surface-alt); border: 1px solid var(--border-strong);
    border-radius: 6px; padding: 5px 12px; color: var(--text-2);
    font-size: 11px; font-weight: 500; font-family: var(--font); cursor: pointer;
  }
  .param-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .config-summary { text-align: center; padding: 10px 0 0; font-size: 10px; font-family: var(--mono); color: var(--text-3); }
  .ev-config { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); }
  .footer { text-align: center; padding: 20px 16px 0; font-size: 10px; font-family: var(--mono); color: var(--text-3); }
  .footer a { color: var(--text-3); }
  .sidebar-footer { display: none; }
  .offline-badge {
    display: none; position: fixed; top: 8px; right: 8px; z-index: 200;
    background: var(--cloud); color: white; font-size: 10px; font-weight: 600;
    padding: 4px 10px; border-radius: 20px; font-family: var(--mono);
  }
  .offline-badge.show { display: block; }
  .hidden { display: none !important; }
  .error-msg { text-align: center; padding: 32px; color: #E53935; font-size: 13px; }

  /* ── Desktop layout ── */
  @media (min-width: 900px) {
    .header {
      position: static;
      display: flex; align-items: center; gap: 14px;
      padding: 16px 28px; text-align: left;
      max-width: 1280px; margin: 0 auto;
    }
    .header-icon { margin-bottom: 0; flex-shrink: 0; }
    .header h1 { font-size: 18px; }
    .header-sub { margin-top: 1px; }

    .app-layout {
      display: grid; grid-template-columns: 300px 1fr;
      max-width: 1280px; margin: 0 auto;
      border-top: 1px solid var(--border);
    }
    .left-col {
      position: sticky; top: 0; height: 100vh;
      overflow-y: auto; scrollbar-width: none;
      border-right: 1px solid var(--border);
      padding-bottom: 24px;
    }
    .left-col::-webkit-scrollbar { display: none; }
    .right-col { min-width: 0; padding-bottom: 32px; }

    /* Vertical day cards */
    .weekly-section { padding: 16px 12px 0; }
    .weekly-scroll { flex-direction: column; overflow-x: visible; gap: 6px; }
    .day-card {
      display: flex; align-items: center; gap: 10px;
      min-width: unset; width: 100%; text-align: left; padding: 9px 12px;
    }
    .day-card .day-name { width: 28px; margin: 0; }
    .day-card .day-date { flex: 1; font-size: 12px; margin: 0; }
    .day-card .day-cloud { margin-top: 0; }

    /* Hide mini bar chart — cards convey the same info */
    .week-bar-wrap { display: none; }

    /* Config always visible in left col */
    .config-btn-wrap { display: none; }
    .config-toggle { display: none; }
    .config-panel.hidden { display: block !important; }
    .config-panel { margin: 16px 0 0; padding: 0 12px; animation: none; }
    .config-panel .config-inner {
      box-shadow: none; border-color: transparent;
      background: transparent; padding: 0;
    }
    .config-panel .config-inner .field-label { color: var(--text-3); }

    /* Location in section title hidden on desktop — header shows it */
    .section-location { display: none; }

    /* Right col */
    .stats { max-width: unset; padding: 20px 20px 0; }
    .sun-strip { padding: 10px 20px; justify-content: flex-start; }
    .weather-strip { padding: 6px 20px 10px; justify-content: flex-start; }
    .chart-section { max-width: unset; padding: 0 16px; }
    .chart-canvas-wrap { height: 320px; }
    .ev-strip { max-width: unset; margin: 10px 0 0; padding: 0 16px; }

    /* Footer: hide main footer on desktop, use sidebar-footer instead */
    .footer { display: none; }
    .sidebar-footer {
      display: block; font-size: 10px; font-family: var(--mono); color: var(--text-3);
      padding: 12px 12px 16px; border-top: 1px solid var(--border); margin-top: 16px;
      position: sticky; bottom: 0; background: var(--bg);
    }
    .sidebar-footer a { color: var(--text-3); }
  }
</style>
</head>
<body>

<div class="offline-badge" id="offlineBadge">Cached</div>

<div class="header">
  <div class="header-icon">
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
      <circle cx="10" cy="10" r="4.5" fill="white" opacity="0.95"/>
      <path d="M10 1v2.5M10 16.5V19M1 10h2.5M16.5 10H19M3.7 3.7l1.8 1.8M14.5 14.5l1.8 1.8M3.7 16.3l1.8-1.8M14.5 5.5l1.8-1.8" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
    </svg>
  </div>
  <h1>Solar Forecast</h1>
  <p class="header-sub" id="locationLabel">Loading…</p>
</div>

<div class="app-layout">
<div class="left-col">

<div class="weekly-section">
  <div class="section-title">7-Day Outlook<span class="section-location" id="sectionTitle"></span></div>
  <div class="weekly-scroll" id="weeklyScroll"></div>
</div>

<div class="config-btn-wrap no-ring" id="configBtnWrap">
  <button class="config-toggle" id="configToggle">Configure System ↓</button>
</div>

<div class="config-panel hidden" id="configPanel">
  <div class="config-inner">
    <div>
      <label class="field-label">Location</label>
      <div class="search-row">
        <div class="autocomplete-wrap">
          <input class="text-input" id="addressInput" placeholder="Enter address or city…" autocomplete="off">
          <div class="autocomplete-list hidden" id="acList"></div>
        </div>
        <button class="btn-primary" id="searchBtn">Search</button>
      </div>
    </div>
    <div style="margin-bottom:14px">
      <label class="field-label">Quick Presets</label>
      <div style="display:flex;gap:6px;flex-wrap:wrap" id="presetContainer"></div>
    </div>
    <div class="param-grid">
      <div><label class="field-label">Array (kW)<span class="hint-icon" data-hint="Total nameplate capacity of your panels, e.g. 6.6kW for 20 × 330W panels.">i</span></label><input class="num-input" id="cfgSystem" type="number" step="0.5"></div>
      <div><label class="field-label">Inverter (kW)<span class="hint-icon" data-hint="Max AC output of your inverter. Output clips at this value on sunny peaks.">i</span></label><input class="num-input" id="cfgInverter" type="number" step="0.5"></div>
      <div><label class="field-label">Perf. Ratio<span class="hint-icon" data-hint="Real-world efficiency factor accounting for heat, shading, and wiring losses. Typically 0.75–0.85.">i</span></label><input class="num-input" id="cfgPR" type="number" step="0.01"></div>
      <div><label class="field-label">Tilt (°)<span class="hint-icon" data-hint="Panel angle from horizontal. 0° = flat roof, 90° = vertical wall. Typical roofs: 15–35°.">i</span></label><input class="num-input" id="cfgTilt" type="number" step="1"></div>
      <div><label class="field-label">Azimuth (°)<span class="hint-icon" data-hint="Panel direction. Open-Meteo convention: 0° = south, 180° = north, −90° = east, 90° = west.">i</span></label><input class="num-input" id="cfgAzimuth" type="number" step="5"></div>
      <div><label class="field-label">Forecast Days</label><input class="num-input" id="cfgDays" type="number" step="1" min="1" max="16"></div>
    </div>
    <div class="ev-config">
      <label class="field-label">EV Charging Threshold (kW)<span class="hint-icon" data-hint="Minimum output needed to count as a viable EV charging hour. Set to your charger's rated draw.">i</span></label>
      <input class="num-input" id="cfgEvThreshold" type="number" step="0.5" style="max-width:160px">
    </div>
    <button class="btn-primary" id="applyBtn" style="width:100%;margin-top:14px;padding:11px">Update Forecast</button>
    <div class="config-summary" id="configSummary"></div>
  </div>
</div>

<div class="sidebar-footer">
  Data from <a href="https://open-meteo.com" target="_blank" rel="noopener">Open-Meteo</a> · GTI Forecast
  <div style="margin-top:3px">Auto-refreshes every 30 min</div>
</div>

</div><!-- /left-col -->
<div class="right-col">

<div class="week-bar-wrap">
  <div class="week-bars" id="weekBars"></div>
</div>

<div class="stats">
  <div class="stat-card">
    <div class="stat-label">Estimated</div>
    <div class="stat-value" id="dailyKwh">—</div>
    <div class="stat-unit" id="dailyCaption">kWh</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">Peak</div>
    <div class="stat-value gold" id="peakKw">—</div>
    <div class="stat-unit gold">kW</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">Now</div>
    <div class="stat-value gold" id="nowKw">—</div>
    <div class="stat-unit" id="nowUnit"></div>
  </div>
</div>

<div class="sun-strip">
  <span>

<script>
const DEFAULTS = {
  lat: 0, lon: 0, systemKw: 7, inverterKw: 5, pr: 0.80, tilt: 25, azimuth: 180,
  forecastDays: 7, evThreshold: 4, locationName: '',
  presets: []
};

let config, allDays = [], selectedDayIdx = 0, chart = null;
const $ = id => document.getElementById(id);

function loadConfig() {
  try {
    const s = localStorage.getItem('solar-forecast-config');
    if (s) { const parsed = JSON.parse(s); if (parsed.lat) return { ...DEFAULTS, ...parsed }; }
  } catch(e) {}
  return null;
}
function saveConfig() {
  try { localStorage.setItem('solar-forecast-config', JSON.stringify(config)); } catch(e) {}
}
function cacheData(data) {
  try { localStorage.setItem('solar-forecast-cache', JSON.stringify({ ts: Date.now(), data })); } catch(e) {}
}
function getCachedData() {
  try {
    const c = JSON.parse(localStorage.getItem('solar-forecast-cache'));
    if (c && Date.now() - c.ts < 6*3600*1000) return c.data;
  } catch(e) {}
  return null;
}

function kwAtGti(gti) { return Math.min(config.inverterKw, (config.systemKw * config.pr * gti) / 1000); }
function parseHour(iso) { const d = new Date(iso); return d.getHours() + d.getMinutes() / 60; }
function fmtTime(h) { const hh = Math.floor(h), mm = Math.round((h-hh)*60); return `${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}`; }
function dayName(iso) { return new Date(iso+'T12:00:00').toLocaleDateString('en-AU',{weekday:'short'}); }
function dayDate(iso) { return new Date(iso+'T12:00:00').toLocaleDateString('en-AU',{day:'numeric',month:'short'}); }

function populateFields() {
  $('cfgSystem').value = config.systemKw;
  $('cfgInverter').value = config.inverterKw;
  $('cfgPR').value = config.pr;
  $('cfgTilt').value = config.tilt;
  $('cfgAzimuth').value = config.azimuth;
  $('cfgDays').value = config.forecastDays;
  $('cfgEvThreshold').value = config.evThreshold;
  $('locationLabel').textContent = (config.locationName || 'Set location below') + ' · ' +
    new Date().toLocaleDateString('en-AU',{weekday:'long',day:'numeric',month:'short'});
  $('sectionTitle').textContent = config.locationName ? ' — ' + config.locationName : '';
  $('configSummary').textContent = config.locationName ?
    `${config.systemKw}kW · ${config.inverterKw}kW inv · PR ${config.pr} · ${config.tilt}° tilt · ${config.azimuth}° az` : '';
  // Ring: show when location not yet set
  const hasLocation = !!(config.lat || config.lon);
  $('configBtnWrap').classList.toggle('no-ring', hasLocation);
  markDefaults();
  const pc = $('presetContainer');
  pc.innerHTML = '';
  (config.presets||[]).forEach(p => {
    const btn = document.createElement('button');
    btn.className = 'btn-secondary'; btn.textContent = p.label;
    btn.onclick = () => { Object.assign(config,p); config.locationName = p.label; saveConfig(); populateFields(); fetchForecast(); };
    pc.appendChild(btn);
  });
}

function markDefaults() {
  [['cfgSystem','systemKw'],['cfgInverter','inverterKw'],['cfgPR','pr'],
   ['cfgTilt','tilt'],['cfgAzimuth','azimuth'],['cfgDays','forecastDays'],
   ['cfgEvThreshold','evThreshold']].forEach(([id, key]) => {
    const el = $(id);
    const isDefault = parseFloat(el.value) === DEFAULTS[key];
    el.classList.toggle('is-default', isDefault);
    el.title = isDefault ? 'Default value' : '';
  });
}

function readFields() {
  config.systemKw = parseFloat($('cfgSystem').value) || config.systemKw;
  config.inverterKw = parseFloat($('cfgInverter').value) || config.inverterKw;
  config.pr = parseFloat($('cfgPR').value) || config.pr;
  config.tilt = parseFloat($('cfgTilt').value) ?? config.tilt;
  config.azimuth = parseFloat($('cfgAzimuth').value) ?? config.azimuth;
  config.forecastDays = Math.max(1, Math.min(16, parseInt($('cfgDays').value)||7));
  config.evThreshold = parseFloat($('cfgEvThreshold').value) || 4;
}

// ── First-run setup via geolocation ──
async function initLocation() {
  const saved = loadConfig();
  if (saved) { config = saved; populateFields(); fetchForecast(); return; }
  config = { ...DEFAULTS };
  // Try browser geolocation
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
      pos => {
        config.lat = Math.round(pos.coords.latitude * 100) / 100;
        config.lon = Math.round(pos.coords.longitude * 100) / 100;
        config.locationName = `${config.lat.toFixed(2)}, ${config.lon.toFixed(2)}`;
        saveConfig(); populateFields(); fetchForecast();
      },
      () => { showSetup(); },
      { enableHighAccuracy: false, timeout: 5000 }
    );
  } else { showSetup(); }
}

function showSetup() {
  config.locationName = 'Set location below';
  populateFields();
  $('configPanel').classList.remove('hidden');
  $('configToggle').textContent = 'Hide Settings ↑';
  $('configBtnWrap').classList.remove('no-ring');
  $('locationLabel').textContent = 'Welcome — set your location to get started';
  $('loadingOverlay').classList.add('hidden');
}

// ── Fetch ──
async function fetchForecast() {
  if (!config.lat && !config.lon) { showSetup(); return; }
  $('loadingOverlay').classList.remove('hidden');
  $('errorMsg').classList.add('hidden');
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${config.lat}&longitude=${config.lon}`
    + `&hourly=global_tilted_irradiance,cloud_cover`
    + `&daily=sunrise,sunset,temperature_2m_max,temperature_2m_min,weather_code`
    + `&timezone=auto&forecast_days=${config.forecastDays}`
    + `&tilt=${config.tilt}&azimuth=${config.azimuth}`;
  let data;
  try {
    const resp = await fetch(url);
    if (!resp.ok) throw new Error('API '+resp.status);
    data = await resp.json();
    cacheData(data);
    $('offlineBadge').classList.remove('show');
  } catch(e) {
    data = getCachedData();
    if (data) { $('offlineBadge').classList.add('show'); }
    else { $('errorMsg').textContent = 'Failed: '+e.message; $('errorMsg').classList.remove('hidden'); $('loadingOverlay').classList.add('hidden'); return; }
  }
  processData(data);
  $('loadingOverlay').classList.add('hidden');
}

function wmoEmoji(code) {
  if (code <= 0) return '☀️';
  if (code <= 2) return '⛅';
  if (code === 3) return '☁️';
  if (code <= 48) return '🌫️';
  if (code <= 57) return '🌦️';
  if (code <= 67) return '🌧️';
  if (code <= 77) return '❄️';
  if (code <= 82) return '🌧️';
  if (code <= 86) return '🌨️';
  if (code >= 95) return '⛈️';
  return '☁️';
}

function wmoLabel(code) {
  if (code <= 0) return 'Clear';
  if (code <= 2) return 'Partly cloudy';
  if (code === 3) return 'Overcast';
  if (code <= 48) return 'Foggy';
  if (code <= 57) return 'Drizzle';
  if (code <= 67) return 'Rain';
  if (code <= 77) return 'Snow';
  if (code <= 82) return 'Showers';
  if (code <= 86) return 'Snow showers';
  if (code >= 95) return 'Thunderstorm';
  return 'Cloudy';
}

function processData(data) {
  const hours = data.hourly.time;
  const gti = data.hourly.global_tilted_irradiance;
  const clouds = data.hourly.cloud_cover;
  const dailyDates = data.daily.time;
  const sunrises = data.daily.sunrise;
  const sunsets = data.daily.sunset;
  const tempMax = data.daily.temperature_2m_max || [];
  const tempMin = data.daily.temperature_2m_min || [];
  const weatherCodes = data.daily.weather_code || [];

  const dayMap = {};
  for (let i = 0; i < hours.length; i++) {
    const ds = hours[i].substring(0,10);
    if (!dayMap[ds]) dayMap[ds] = [];
    dayMap[ds].push({ time: fmtTime(parseHour(hours[i])), hour: parseHour(hours[i]), gti: gti[i]??0, kw: kwAtGti(gti[i]??0), cloud: clouds[i]??0 });
  }

  allDays = [];
  dailyDates.forEach((d,i) => {
    const rows = dayMap[d] || [];
    const totalKwh = rows.reduce((s,r)=>s+r.kw, 0);
    const peakKw = rows.reduce((m,r)=>Math.max(m,r.kw), 0);
    const avgCloud = rows.length ? rows.reduce((s,r)=>s+r.cloud,0)/rows.length : 0;
    const srH = sunrises[i] ? parseHour(sunrises[i]) : null;
    const ssH = sunsets[i] ? parseHour(sunsets[i]) : null;

    // EV window: longest consecutive run above threshold during daylight
    let evStart=null, evEnd=null, evBest=0, curS=null, curL=0;
    for (const r of rows) {
      if (Math.round(r.kw * 10) / 10 >= config.evThreshold && r.hour >= 6 && r.hour <= 18) {
        if (curS === null) curS = r.hour;
        curL++;
      } else {
        if (curL > evBest) { evBest=curL; evStart=curS; evEnd=r.hour; }
        curS=null; curL=0;
      }
    }
    if (curL > evBest) { evBest=curL; evStart=curS; evEnd=curS+curL; }

    allDays.push({ date:d, rows, totalKwh, peakKw, avgCloud, sunriseH:srH, sunsetH:ssH,
      sunriseStr: srH?fmtTime(srH):'—', sunsetStr: ssH?fmtTime(ssH):'—',
      evStart, evEnd, evHours:evBest,
      tMax: tempMax[i] ?? null, tMin: tempMin[i] ?? null,
      wCode: weatherCodes[i] ?? 0 });
  });

  if (selectedDayIdx >= allDays.length) selectedDayIdx = 0;
  renderWeekly();
  renderSelectedDay();
}

function renderWeekly() {
  const scroll=$('weeklyScroll'), bars=$('weekBars');
  scroll.innerHTML=''; bars.innerHTML='';
  const maxKwh = Math.max(...allDays.map(d=>d.totalKwh), 1);
  allDays.forEach((day,i) => {
    const card = document.createElement('div');
    card.className = 'day-card'+(i===selectedDayIdx?' active':'');
    const wi = wmoEmoji(day.wCode);
    const temps = day.tMin !== null ? `${Math.round(day.tMin)}°/${Math.round(day.tMax)}°` : '';
    const evClass = day.evHours > 2 ? 'ev-good' : day.evHours >= 1 ? 'ev-part' : 'ev-none';
    card.innerHTML = `<div class="day-name">${dayName(day.date)}</div><div class="day-date">${dayDate(day.date)}</div><div class="kwh-badge ${evClass}"><span class="kval">${day.totalKwh.toFixed(0)}</span><span class="kunit">kWh</span></div><div class="day-cloud">${wi} ${temps}</div>`;
    card.onclick = () => { selectedDayIdx=i; renderWeekly(); renderSelectedDay(); };
    scroll.appendChild(card);

    const bar = document.createElement('div');
    bar.className = 'week-bar'+(i===selectedDayIdx?' active':'')+(day.avgCloud>60?' cloudy':'');
    bar.style.height = Math.max(6, (day.totalKwh/maxKwh)*100)+'%';
    bars.appendChild(bar);
  });
}

function renderSelectedDay() {
  const day = allDays[selectedDayIdx];
  if (!day) return;
  const evColour = day.evHours > 2 ? 'green' : day.evHours >= 1 ? 'amber' : 'red';
  const evCaption = { green: 'kWh ▲ great day', amber: 'kWh · fair day', red: 'kWh ▼ low yield' };
  $('dailyKwh').className = 'stat-value ' + evColour;
  $('dailyCaption').className = 'stat-unit ' + evColour;
  $('dailyCaption').textContent = evCaption[evColour];
  $('dailyKwh').textContent = day.totalKwh.toFixed(1);
  $('peakKw').textContent = day.peakKw.toFixed(1);

  const now = new Date();
  const today = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
  const isToday = day.date === today;
  const nowH = now.getHours() + now.getMinutes()/60;
  if (isToday) {
    const c = day.rows.reduce((b,r) => Math.abs(r.hour-nowH)<Math.abs(b.hour-nowH)?r:b, day.rows[0]);
    if (c && Math.abs(c.hour-nowH)<0.6) { $('nowKw').textContent=c.kw.toFixed(1); $('nowUnit').className='stat-unit gold'; $('nowUnit').textContent='kW'; }
    else { $('nowKw').textContent='—'; $('nowUnit').className='stat-unit'; $('nowUnit').textContent=''; }
  } else { $('nowKw').textContent='—'; $('nowUnit').className='stat-unit'; $('nowUnit').textContent=''; }

  $('sunriseTime').textContent = day.sunriseStr;
  $('sunsetTime').textContent = day.sunsetStr;

  // Weather
  $('weatherEmoji').textContent = wmoEmoji(day.wCode);
  $('weatherDesc').textContent = wmoLabel(day.wCode);
  $('weatherTemps').textContent = day.tMin !== null ? `${Math.round(day.tMin)}° / ${Math.round(day.tMax)}°` : '—';

  const ev = $('evCard');
  ev.classList.remove('no-window', 'part-window');
  if (day.evHours > 2) {
    $('evLabel').textContent = `EV charge window: ${fmtTime(day.evStart)} – ${fmtTime(day.evEnd)}`;
    $('evDetail').textContent = `${day.evHours}h above ${config.evThreshold}kW`;
  } else if (day.evHours >= 1) {
    ev.classList.add('part-window');
    $('evLabel').textContent = `EV charge window: ${fmtTime(day.evStart)} – ${fmtTime(day.evEnd)}`;
    $('evDetail').textContent = `${day.evHours}h above ${config.evThreshold}kW`;
  } else {
    ev.classList.add('no-window');
    $('evLabel').textContent = 'No viable charge window';
    $('evDetail').textContent = `Below ${config.evThreshold}kW threshold all day`;
  }
  renderChart(day, isToday, nowH);
}

function renderChart(day, isToday, nowH) {
  const ctx = $('solarChart').getContext('2d');
  const rows = day.rows.filter(r => r.hour>=5 && r.hour<=21);
  const labels = rows.map(r=>r.time);
  const kwData = rows.map(r=>r.kw);
  const cloudData = rows.map(r=>r.cloud);

  // EV window: kW values only within the window, null elsewhere (fills under the solar curve)
  const evData = rows.map(r =>
    (day.evStart!==null && r.hour>=day.evStart && r.hour<=day.evEnd) ? r.kw : null
  );

  const grad = ctx.createLinearGradient(0,0,0,260);
  grad.addColorStop(0,'rgba(232,149,14,0.22)');
  grad.addColorStop(0.5,'rgba(232,149,14,0.06)');
  grad.addColorStop(1,'rgba(232,149,14,0)');

  // Diagonal hatching pattern for EV window fill
  const patCanvas = document.createElement('canvas');
  patCanvas.width = 7; patCanvas.height = 7;
  const patCtx = patCanvas.getContext('2d');
  patCtx.fillStyle = 'rgba(52,199,89,0.07)';
  patCtx.fillRect(0, 0, 7, 7);
  patCtx.strokeStyle = 'rgba(52,199,89,0.42)';
  patCtx.lineWidth = 1.5;
  patCtx.beginPath(); patCtx.moveTo(0,7); patCtx.lineTo(7,0); patCtx.stroke();
  const evGrad = ctx.createPattern(patCanvas, 'repeat');

  const ptBg = rows.map(() => 'transparent');
  const ptR = rows.map(() => 0);
  const ptBorder = rows.map(() => 'transparent');

  const yMax = Math.max(config.inverterKw * 1.15, Math.max(...kwData) * 1.1);

  if (chart) chart.destroy();
  chart = new Chart(ctx, {
    type:'line',
    data: {
      labels,
      datasets: [
        {
          label:'Cloud', data:cloudData,
          borderColor:'rgba(144,164,174,0.5)', backgroundColor:'rgba(144,164,174,0.1)',
          borderWidth:1.5, borderDash:[3,3], fill:true, tension:0.3, pointRadius:0,
          yAxisID:'y1', order:3
        },
        {
          label:'EV Window', data:evData,
          borderColor:'rgba(52,199,89,0.6)', borderWidth:2, borderDash:[4,3],
          backgroundColor:evGrad, fill:true, tension:0.35,
          pointRadius:0, spanGaps:false,
          yAxisID:'y', order:2
        },
        {
          label:'kW', data:kwData,
          borderColor:'#E8950E', borderWidth:2.5, backgroundColor:grad, fill:true, tension:0.35,
          pointBackgroundColor:ptBg, pointBorderColor:ptBorder, pointBorderWidth:2, pointRadius:ptR,
          pointHoverRadius:5, pointHoverBackgroundColor:'#E8950E',
          yAxisID:'y', order:1
        }
      ]
    },
    options: {
      responsive:true, maintainAspectRatio:false,
      interaction:{mode:'index',intersect:false},
      plugins: {
        legend:{display:false},
        tooltip:{
          backgroundColor:'rgba(255,255,255,0.75)', borderColor:'rgba(0,0,0,0.06)', borderWidth:1,
          titleColor:'#1D1D1F', titleFont:{family:'Outfit',weight:'600',size:12},
          bodyColor:'#6E6E73', bodyFont:{family:'IBM Plex Mono',size:10},
          padding:{top:6,bottom:6,left:10,right:10}, cornerRadius:8,
          displayColors:false,
          position:'nearest',
          yAlign:'top',
          caretSize:4,
          callbacks: {
            title: items=>items[0].label,
            label: item => {
              if(item.datasetIndex===0) return `☁ ${cloudData[item.dataIndex]}%`;
              if(item.datasetIndex===1) return null;
              return `${kwData[item.dataIndex].toFixed(1)}kW · ${rows[item.dataIndex].gti.toFixed(0)}W/m²`;
            },
            afterBody: ()=>null
          },
          filter: item => item.datasetIndex!==1
        }
      },
      scales: {
        x: { grid:{color:'rgba(0,0,0,0.03)',drawBorder:false}, ticks:{color:'#AEAEB2',font:{family:'IBM Plex Mono',size:10},maxRotation:0,autoSkip:true,maxTicksLimit:9} },
        y: { position:'left', grid:{color:'rgba(0,0,0,0.03)',drawBorder:false}, ticks:{color:'#AEAEB2',font:{family:'IBM Plex Mono',size:10}}, beginAtZero:true, max:yMax, title:{display:true,text:'kW',color:'#AEAEB2',font:{family:'IBM Plex Mono',size:10}} },
        y1: { position:'right', grid:{display:false}, ticks:{color:'#AEAEB2',font:{family:'IBM Plex Mono',size:9},callback:v=>v+'%'}, beginAtZero:true, max:100, title:{display:true,text:'Cloud',color:'#AEAEB2',font:{family:'IBM Plex Mono',size:9}} }
      }
    },
    plugins: [
    {
      id:'inverterLimit',
      afterDraw(ci) {
        const {ctx,scales:{x,y}} = ci;
        const yPos = y.getPixelForValue(config.inverterKw);
        ctx.save();
        ctx.beginPath();
        ctx.setLineDash([6,4]);
        ctx.strokeStyle = 'rgba(229,57,53,0.45)';
        ctx.lineWidth = 1.5;
        ctx.moveTo(x.left, yPos);
        ctx.lineTo(x.right, yPos);
        ctx.stroke();
        // Label
        ctx.fillStyle = 'rgba(229,57,53,0.6)';
        ctx.font = '500 9px IBM Plex Mono';
        ctx.fillText(`${config.inverterKw}kW limit`, x.right - 62, yPos - 5);
        ctx.restore();
      }
    },
    {
      id:'sunLines',
      afterDraw(ci) {
        const {ctx,scales:{x,y}} = ci;
        const draw = (ts,col,lbl) => {
          const idx=labels.indexOf(ts); if(idx<0) return;
          const xp=x.getPixelForValue(idx);
          ctx.save(); ctx.beginPath(); ctx.setLineDash([4,4]);
          ctx.strokeStyle=col; ctx.lineWidth=1; ctx.globalAlpha=0.45;
          ctx.moveTo(xp,y.top); ctx.lineTo(xp,y.bottom); ctx.stroke();
          ctx.globalAlpha=0.65; ctx.fillStyle=col;
          ctx.font='500 9px IBM Plex Mono';
          ctx.fillText(lbl,xp+3,y.top+11); ctx.restore();
        };
        if(day.sunriseH) draw(fmtTime(day.sunriseH),'#E8950E','☀ Rise');
        if(day.sunsetH) draw(fmtTime(day.sunsetH),'#4A9EE8','☾ Set');
      }
    },
    {
      id:'nowMarker',
      afterDraw(ci) {
        if (!isToday) return;
        const {ctx, scales:{x, y}} = ci;
        // Find the two surrounding rows to interpolate exact position
        let i0 = -1;
        for (let i = 0; i < rows.length - 1; i++) {
          if (rows[i].hour <= nowH && rows[i+1].hour > nowH) { i0 = i; break; }
        }
        if (i0 < 0) return;
        const frac = (nowH - rows[i0].hour) / (rows[i0+1].hour - rows[i0].hour);
        const xPos = x.getPixelForValue(i0) + frac * (x.getPixelForValue(i0+1) - x.getPixelForValue(i0));
        const kwNow = rows[i0].kw + frac * (rows[i0+1].kw - rows[i0].kw);
        const yPos = y.getPixelForValue(kwNow);
        ctx.save();
        // Dotted crosshair lines
        ctx.setLineDash([2, 4]);
        ctx.lineWidth = 1;
        ctx.strokeStyle = 'rgba(232,149,14,0.55)';
        ctx.beginPath(); ctx.moveTo(xPos, yPos); ctx.lineTo(xPos, y.bottom); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(xPos, yPos); ctx.lineTo(x.left, yPos); ctx.stroke();
        // Single orange dot
        ctx.setLineDash([]);
        ctx.beginPath();
        ctx.arc(xPos, yPos, 5, 0, Math.PI * 2);
        ctx.fillStyle = '#E8950E';
        ctx.fill();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.restore();
      }
    }]
  });
}

// Geocoding with autocomplete
let acTimer = null;
let acResults = [];

function showAcList(results) {
  const list = $('acList');
  acResults = results;
  if (!results.length) { list.classList.add('hidden'); return; }
  list.innerHTML = '';
  results.forEach((r, i) => {
    const item = document.createElement('div');
    item.className = 'ac-item';
    const name = `${r.name}${r.admin1 ? ', ' + r.admin1 : ''}${r.country ? ', ' + r.country : ''}`;
    const detail = `${r.latitude.toFixed(2)}°, ${r.longitude.toFixed(2)}°` + (r.elevation != null ? ` · ${Math.round(r.elevation)}m` : '');
    item.innerHTML = `<span class="ac-name">${name}</span><span class="ac-detail">${detail}</span>`;
    item.onclick = () => selectAcResult(r);
    list.appendChild(item);
  });
  list.classList.remove('hidden');
}

function selectAcResult(loc) {
  config.lat = loc.latitude;
  config.lon = loc.longitude;
  config.locationName = `${loc.name}${loc.admin1 ? ', ' + loc.admin1 : ''}`;
  $('addressInput').value = '';
  $('acList').classList.add('hidden');
  acResults = [];
  saveConfig(); populateFields(); fetchForecast();
}

async function acSearch(query) {
  if (query.length < 2) { $('acList').classList.add('hidden'); return; }
  try {
    const r = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=5&language=en`);
    const d = await r.json();
    // Only show if input still matches (avoid stale results)
    if ($('addressInput').value.trim().toLowerCase() === query.toLowerCase()) {
      showAcList(d.results || []);
    }
  } catch(e) { /* silently fail for typeahead */ }
}

async function geocode() {
  const addr = $('addressInput').value.trim();
  if (!addr) return;
  // If we have autocomplete results, select the first one
  if (acResults.length) { selectAcResult(acResults[0]); return; }
  try {
    const r = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(addr)}&count=1&language=en`);
    const d = await r.json();
    if (!d.results?.length) { alert('Location not found'); return; }
    selectAcResult(d.results[0]);
  } catch(e) { alert('Geocoding failed'); }
}

// Events
$('addressInput').addEventListener('input', e => {
  clearTimeout(acTimer);
  const q = e.target.value.trim();
  if (q.length < 2) { $('acList').classList.add('hidden'); return; }
  acTimer = setTimeout(() => acSearch(q), 250);
});
$('addressInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); geocode(); }
  if (e.key === 'Escape') { $('acList').classList.add('hidden'); }
});
// Close dropdown when clicking outside
document.addEventListener('click', e => {
  if (!e.target.closest('.autocomplete-wrap')) $('acList').classList.add('hidden');
});

$('configToggle').addEventListener('click',()=>{
  const h=$('configPanel').classList.toggle('hidden');
  $('configToggle').textContent=h?'Configure System ↓':'Hide Settings ↑';
});
$('searchBtn').addEventListener('click', geocode);
$('applyBtn').addEventListener('click',()=>{ readFields(); saveConfig(); populateFields(); fetchForecast(); });

// Field hints — tap i to toggle inline explanation
document.querySelectorAll('.hint-icon').forEach(icon => {
  icon.title = icon.dataset.hint;
  icon.addEventListener('click', e => {
    e.stopPropagation();
    const wrap = icon.closest('div');
    let hint = wrap.querySelector('.hint-text');
    if (!hint) {
      hint = document.createElement('div');
      hint.className = 'hint-text';
      hint.textContent = icon.dataset.hint;
      wrap.insertBefore(hint, wrap.querySelector('input'));
    }
    hint.classList.toggle('hint-visible');
  });
});

// Pull-to-refresh
let ts=0;
document.addEventListener('touchstart',e=>{if(window.scrollY===0)ts=e.touches[0].clientY;},{passive:true});
document.addEventListener('touchend',e=>{if(ts&&e.changedTouches[0].clientY-ts>100)fetchForecast();ts=0;},{passive:true});

// Service worker
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}

// Init
initLocation();
setInterval(fetchForecast, 30*60*1000);
</script>
